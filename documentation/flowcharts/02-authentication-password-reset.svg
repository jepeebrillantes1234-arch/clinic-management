<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title description">
<title id="title">Authentication and Password Reset Flow</title><desc id="description">Login, session creation, and the six-digit password-reset process.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070" /></marker><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#14213d}.subtitle{font-size:16px;fill:#52616b}.node-text{font-size:17px;font-weight:600;fill:#14213d}.number{font-size:16px;font-weight:700;fill:#ffffff}.decision{fill:#fff2cc}.normal{fill:#edf4fa}.end{fill:#e6f4ea}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="130" y="52" class="title">Authentication and Password Reset Flow</text><text x="130" y="82" class="subtitle">Login, session creation, and the six-digit password-reset process.</text>
<rect x="130" y="160" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="195" r="18" fill="#355070"/><text x="170" y="201" class="number" text-anchor="middle">1</text><text x="210" y="201" class="node-text">Open Landing page</text>
<line x1="600" y1="230" x2="600" y2="264" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="274" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="309" r="18" fill="#355070"/><text x="170" y="315" class="number" text-anchor="middle">2</text><text x="210" y="315" class="node-text">Submit username and password</text>
<line x1="600" y1="344" x2="600" y2="378" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="388" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="423" r="18" fill="#355070"/><text x="170" y="429" class="number" text-anchor="middle">3</text><text x="210" y="429" class="node-text">Credentials valid? — No: show form error / Yes: create session</text>
<line x1="600" y1="458" x2="600" y2="492" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="502" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="537" r="18" fill="#355070"/><text x="170" y="543" class="number" text-anchor="middle">4</text><text x="210" y="543" class="node-text">Redirect authenticated user to Dashboard</text>
<line x1="600" y1="572" x2="600" y2="606" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="616" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="651" r="18" fill="#355070"/><text x="170" y="657" class="number" text-anchor="middle">5</text><text x="210" y="657" class="node-text">Forgot password: submit username or email</text>
<line x1="600" y1="686" x2="600" y2="720" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="730" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="765" r="18" fill="#355070"/><text x="170" y="771" class="number" text-anchor="middle">6</text><text x="210" y="771" class="node-text">Matching account with email? — No: show error / Yes: create six-digit reset code and email it</text>
<line x1="600" y1="800" x2="600" y2="834" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="844" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="879" r="18" fill="#355070"/><text x="170" y="885" class="number" text-anchor="middle">7</text><text x="210" y="885" class="node-text">Enter reset code and new password</text>
<line x1="600" y1="914" x2="600" y2="948" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="958" width="940" height="70" rx="10" class="end" stroke="#355070" stroke-width="2"/><circle cx="170" cy="993" r="18" fill="#355070"/><text x="170" y="999" class="number" text-anchor="middle">8</text><text x="210" y="999" class="node-text">Code valid, unused, and less than 15 minutes old? — No: reject / Yes: set new password, mark code used, return to Landing</text>
</svg>
