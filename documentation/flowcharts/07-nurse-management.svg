<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1006" viewBox="0 0 1200 1006" role="img" aria-labelledby="title description">
<title id="title">Assistant / Nurse Management Flow</title><desc id="description">Admin workflow for nurse profile records and optional login accounts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070" /></marker><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#14213d}.subtitle{font-size:16px;fill:#52616b}.node-text{font-size:17px;font-weight:600;fill:#14213d}.number{font-size:16px;font-weight:700;fill:#ffffff}.decision{fill:#fff2cc}.normal{fill:#edf4fa}.end{fill:#e6f4ea}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="130" y="52" class="title">Assistant / Nurse Management Flow</text><text x="130" y="82" class="subtitle">Admin workflow for nurse profile records and optional login accounts.</text>
<rect x="130" y="160" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="195" r="18" fill="#355070"/><text x="170" y="201" class="number" text-anchor="middle">1</text><text x="210" y="201" class="node-text">Admin opens Assistant List</text>
<line x1="600" y1="230" x2="600" y2="264" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="274" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="309" r="18" fill="#355070"/><text x="170" y="315" class="number" text-anchor="middle">2</text><text x="210" y="315" class="node-text">Add or edit assistant information through NurseForm</text>
<line x1="600" y1="344" x2="600" y2="378" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="388" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="423" r="18" fill="#355070"/><text x="170" y="429" class="number" text-anchor="middle">3</text><text x="210" y="429" class="node-text">Login account requested? — No: save profile only / Yes: validate username and password</text>
<line x1="600" y1="458" x2="600" y2="492" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="502" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="537" r="18" fill="#355070"/><text x="170" y="543" class="number" text-anchor="middle">4</text><text x="210" y="543" class="node-text">Create or update Django User account</text>
<line x1="600" y1="572" x2="600" y2="606" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="616" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="651" r="18" fill="#355070"/><text x="170" y="657" class="number" text-anchor="middle">5</text><text x="210" y="657" class="node-text">Set User Profile role to nurse</text>
<line x1="600" y1="686" x2="600" y2="720" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="730" width="940" height="70" rx="10" class="decision" stroke="#355070" stroke-width="2"/><circle cx="170" cy="765" r="18" fill="#355070"/><text x="170" y="771" class="number" text-anchor="middle">6</text><text x="210" y="771" class="node-text">Link Nurse profile to the User account and save</text>
<line x1="600" y1="800" x2="600" y2="834" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="130" y="844" width="940" height="70" rx="10" class="end" stroke="#355070" stroke-width="2"/><circle cx="170" cy="879" r="18" fill="#355070"/><text x="170" y="885" class="number" text-anchor="middle">7</text><text x="210" y="885" class="node-text">View assistant details or move the profile to Recycle Bin</text>
</svg>
